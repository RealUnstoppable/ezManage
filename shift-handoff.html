<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Handoffs | ezManage</title>
    <link rel="icon" type="image/jpeg" href="ManagerPro.jpg">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-functions-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module">
        import { loadNavbar } from './js/navbar.js';
        import { loadFooter } from './js/footer.js';
        document.addEventListener('DOMContentLoaded', () => {
            loadNavbar();
            loadFooter();
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pt-20">
    <header class="main-header"></header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full">
        <div class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-white tracking-tight mb-2">Shift Handoffs</h1>
                <p class="text-slate-400">Communicate essential updates across shifts.</p>
            </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 mb-10">
            <h2 class="text-xl font-bold text-white mb-4">Create New Handoff</h2>
            <form id="handoff-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Shift Type</label>
                    <select id="shift-type" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none">
                        <option value="Morning">Morning</option>
                        <option value="Afternoon">Afternoon</option>
                        <option value="Night">Night</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Urgent Alerts / Warnings</label>
                    <input type="text" id="urgent-alerts" placeholder="E.g., Register 2 is short, freezer temp issue" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">General Notes</label>
                    <textarea id="notes" rows="4" placeholder="Summary of shift, tasks completed, pending deliveries..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-6 py-2 rounded-lg transition-colors">Submit Handoff</button>
            </form>
        </div>

        <div>
            <h2 class="text-xl font-bold text-white mb-4">Recent Handoffs</h2>
            <div id="handoff-list" class="space-y-4">
                <p class="text-slate-500" id="loading-text">Loading recent handoffs...</p>
            </div>
        </div>
    </main>

    <footer class="main-footer"></footer>

    <script type="module">
        import { auth } from './js/auth.js';
        import { createHandoff, fetchRecentHandoffs, acknowledgeHandoff } from './js/handoff.js';
        import { showToast, escapeHTML } from './js/utils.js';

        let currentUserId = null;

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUserId = user.uid;
                loadHandoffs();
            } else {
                window.location.href = 'sign in beta.html';
            }
        });

        document.getElementById('handoff-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const type = document.getElementById('shift-type').value;
            const alerts = document.getElementById('urgent-alerts').value;
            const notes = document.getElementById('notes').value;

            try {
                await createHandoff(notes, alerts, type);
                showToast("Handoff submitted successfully.");
                document.getElementById('handoff-form').reset();
                loadHandoffs();
            } catch (err) {
                showToast("Error submitting handoff.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Handoff';
            }
        });

        async function loadHandoffs() {
            const listContainer = document.getElementById('handoff-list');
            try {
                const handoffs = await fetchRecentHandoffs(10);
                if (handoffs.length === 0) {
                    listContainer.innerHTML = '<p class="text-slate-500">No recent handoffs found.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                // ⚡ Bolt Optimization: Use DocumentFragment to batch DOM insertions
                const fragment = document.createDocumentFragment();
                handoffs.forEach(h => {
                    const el = document.createElement('div');
                    el.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 relative';

                    const dateStr = h.createdAt ? new Date(h.createdAt.toMillis()).toLocaleString() : 'Just now';
                    const isAck = h.acknowledgedBy && h.acknowledgedBy.includes(currentUserId);
                    const ackClass = isAck ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-sky-500/10 text-sky-400 border-sky-500/20 cursor-pointer hover:bg-sky-500/20 ack-btn';

                    let ackHtml = `<div class="absolute top-4 right-4 px-3 py-1 rounded-full text-xs font-bold border ${ackClass}" data-id="${escapeHTML(h.id)}" >
                        ${isAck ? '<i data-lucide="check-circle" class="w-3 h-3 inline mr-1"></i> Acknowledged' : 'Acknowledge'}
                    </div>`;

                    el.innerHTML = `
                        ${ackHtml}
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-bold text-slate-300">
                                ${escapeHTML(h.authorName.charAt(0).toUpperCase())}
                            </div>
                            <div>
                                <h3 class="font-bold text-white">${escapeHTML(h.authorName)}</h3>
                                <p class="text-xs text-slate-400">${escapeHTML(dateStr)} &bull; ${escapeHTML(h.shiftType)} Shift</p>
                            </div>
                        </div>
                        ${h.urgentAlerts ? `<div class="mb-3 p-3 bg-red-950/30 border border-red-900/50 rounded-lg text-red-200 text-sm"><strong class="text-red-400">Urgent:</strong> ${escapeHTML(h.urgentAlerts)}</div>` : ''}
                        <div class="text-sm text-slate-300 whitespace-pre-wrap">${escapeHTML(h.notes)}</div>
                    `;
                    fragment.appendChild(el);
                });

                listContainer.appendChild(fragment);
                if (window.lucide) window.lucide.createIcons();

                listContainer.querySelectorAll('.ack-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        try {
                            e.currentTarget.textContent = '...';
                            await acknowledgeHandoff(id);
                            loadHandoffs();
                        } catch (err) {
                            showToast("Failed to acknowledge.");
                        }
                    });
                });

            } catch (err) {
                listContainer.innerHTML = '<p class="text-red-400">Error loading handoffs.</p>';
                console.error(err);
            }
        }
    </script>
</body>
</html>
