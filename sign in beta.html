<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ezManage</title>
    <link rel="icon" type="image/jpeg" href="ManagerPro.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/themes.css">
    <script type="module">
        import { loadNavbar } from './js/navbar.js';
        import { loadFooter } from './js/footer.js';
        document.addEventListener('DOMContentLoaded', () => {
            loadNavbar();
            loadFooter();
        });
    </script>
    <style>
        :root {
            --accent-blue: #2563EB;
            --accent-red: #DC2626;
            --font-main: 'Inter', sans-serif;
        }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color, #0f172a);
            color: var(--text-primary, #f8fafc);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background-color: var(--primary-card-color, #1e293b);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color, #334155);
        }
        .auth-container h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.8rem;
            text-align: center;
            color: var(--accent-blue);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary, #cbd5e1);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color, #334155);
            border-radius: 8px;
            background-color: var(--input-bg, #0f172a);
            color: var(--text-primary, #f8fafc);
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #1d4ed8;
        }
        .toggle-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary, #cbd5e1);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .toggle-link:hover {
            color: var(--accent-blue);
            text-decoration: underline;
        }
        .message {
            color: var(--accent-red);
            text-align: center;
            margin-bottom: 15px;
            min-height: 20px;
            font-size: 0.9rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <header class="main-header"></header>
    <div class="auth-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h2 id="form-title">Sign In</h2>
        <div id="message" class="message"></div>
        <form id="auth-form">
            <div class="form-group" id="username-group" style="display: none;">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" id="submit-btn" class="submit-btn">Sign In</button>
        </form>
        <a href="#" id="toggle-form" class="toggle-link">Don't have an account? Sign Up</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/theme-loader.js"></script>
    <footer class="main-footer"></footer>
</body>
</html>
