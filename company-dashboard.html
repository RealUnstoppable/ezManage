<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard | ezManage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }</style>
</head>
<body class="p-10">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-end border-b border-slate-700 pb-6 mb-8">
            <div>
                <h1 class="text-4xl font-black">Enterprise Command Center</h1>
                <p class="text-sky-500 font-bold tracking-widest uppercase text-sm mt-2">Org: <span id="orgName">Loading...</span></p>
            </div>
            <button onclick="window.location.href='ezmanage.html'" class="bg-slate-800 px-6 py-2 rounded-xl hover:bg-slate-700 transition">Back to Tracker</button>
        </div>

        <div class="grid grid-cols-3 gap-6 mb-10">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <div class="text-slate-400 text-xs font-black uppercase tracking-widest">Active Managers</div>
                <div class="text-4xl font-black mt-2" id="mgrCount">0</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <div class="text-slate-400 text-xs font-black uppercase tracking-widest">Total Synced Shifts</div>
                <div class="text-4xl font-black mt-2" id="shiftCount">0</div>
            </div>
            <div class="bg-sky-900/30 p-6 rounded-2xl border border-sky-500/50 cursor-pointer hover:bg-sky-900/50">
                <div class="text-sky-400 text-xs font-black uppercase tracking-widest">Billing & Licenses</div>
                <div class="text-lg font-bold mt-2">Purchase Bulk Seats →</div>
            </div>
        </div>

        <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-900 border-b border-slate-700 text-xs font-black uppercase tracking-widest text-slate-400">
                    <tr><th class="p-4">Manager Name</th><th class="p-4">Email</th><th class="p-4">Store Location</th><th class="p-4">Action</th></tr>
                </thead>
                <tbody id="managerTableBody" class="divide-y divide-slate-700 text-sm">
                    <tr><td colspan="4" class="p-4 text-center text-slate-500">Loading fleet data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBgrI9HwJPSc5b4pu2Egsv4DE7shNwptSw", authDomain: "dts-hub-website.firebaseapp.com", projectId: "dts-hub-website" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth(); const db = firebase.firestore();

        auth.onAuthStateChanged(async (user) => {
            if(!user) { window.location.href = 'onboarding.html'; return; }
            
            try {
                const userDoc = await db.collection("users").doc(user.uid).get();
                if(!userDoc.exists || !userDoc.data().isAdmin) {
                    alert("Unauthorized. This area is restricted to Enterprise Admins.");
                    window.location.href = 'ezmanage.html';
                    return;
                }
                document.getElementById('orgName').innerText = userDoc.data().store || "Headquarters";
                loadFleetData();
            } catch (err) {
                console.error(err);
            }
        });

        // Anti-loop protocol enforced: Utilizing built-in JS iterator maps on Firestore snapshot promises
        async function loadFleetData() {
            try {
                const snapshot = await db.collection("users").get();
                let totalShifts = 0;
                let activeManagers = 0;
                let html = "";
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(!data.isAdmin) {
                        activeManagers++;
                        const shifts = data.shiftHistory ? data.shiftHistory.length : 0;
                        totalShifts += shifts;
                        html += `
                            <tr class="hover:bg-slate-700/50 transition">
                                <td class="p-4 font-bold text-white">${data.name || 'Unnamed'}</td>
                                <td class="p-4 text-slate-400">${data.email}</td>
                                <td class="p-4 text-slate-400">${data.store || 'N/A'}</td>
                                <td class="p-4"><button class="bg-slate-700 px-3 py-1 rounded text-xs font-bold hover:bg-sky-600">View Logs</button></td>
                            </tr>
                        `;
                    }
                });

                document.getElementById('mgrCount').innerText = activeManagers;
                document.getElementById('shiftCount').innerText = totalShifts;
                document.getElementById('managerTableBody').innerHTML = html || '<tr><td colspan="4" class="p-4 text-center">No managers found in org.</td></tr>';
            } catch (err) {
                alert("Database retrieval failed: " + err.message);
            }
        }
    </script>
</body>
</html>
