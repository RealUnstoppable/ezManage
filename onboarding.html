<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | ezManage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input, select { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 1rem; outline: none; }
        input:focus, select:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 1rem 2rem; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; }
        .btn-accent { background: #0ea5e9; color: white; }
        .btn-outline { background: transparent; border: 2px solid #e2e8f0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg border border-slate-200">
        
        <div id="step-auth" class="step active">
            <h2 class="text-3xl font-black mb-2 text-center" id="authTitle">Sign In</h2>
            <p class="text-slate-500 mb-8 text-center text-sm">Welcome to ezManage.</p>
            <form onsubmit="handleAuth(event)">
                <input type="email" id="authEmail" placeholder="manager@ezmanage.com" required>
                <input type="password" id="authPass" placeholder="••••••••" required>
                <button type="submit" id="authBtn" class="btn btn-accent mb-4">Sign In</button>
            </form>
            <button onclick="signInWithGoogle()" class="btn btn-outline mb-6 flex gap-2"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> Continue with Google</button>
            
            <div class="text-center">
                <button onclick="fillTestData()" class="text-xs text-amber-500 font-bold uppercase tracking-widest mb-4">Load Test Data</button>
                <p class="text-sm text-slate-500"><span id="authToggleText">Don't have an account?</span> <a href="#" onclick="toggleAuthMode(event)" id="authToggleLink" class="text-sky-600 font-bold">Create one</a></p>
            </div>
        </div>

        <div id="step-profile" class="step">
            <h2 class="text-3xl font-black mb-6">About You</h2>
            <input type="text" id="setupName" placeholder="Full Name (e.g. John Doe)" required>
            <input type="text" id="setupPhone" placeholder="Phone Number">
            <input type="text" id="setupRole" placeholder="Manager Position (e.g. Shift Lead)" required>
            <button onclick="nextStep('step-company')" class="btn btn-accent">Continue</button>
        </div>

        <div id="step-company" class="step">
            <h2 class="text-3xl font-black mb-2">Your Store</h2>
            <p class="text-slate-500 mb-6 text-sm">We will auto-configure your tracker templates based on your brand.</p>
            <select id="setupStore" onchange="autoSelectTemplate()">
                <option value="" disabled selected>Select Your Brand...</option>
                <option value="arbys">Arby's</option>
                <option value="mcdonalds">McDonald's</option>
                <option value="tacobell">Taco Bell</option>
                <option value="chickfila">Chick-fil-A</option>
                <option value="pizza">Standard Pizza Shop</option>
                <option value="other">Other / Independent</option>
            </select>
            <div id="templateMsg" class="hidden p-4 bg-sky-50 text-sky-700 rounded-xl mb-6 text-sm font-medium border border-sky-100">
                <i data-lucide="check-circle" class="inline w-4 h-4 mr-1"></i> <span id="templateMsgText"></span>
            </div>
            <button onclick="nextStep('step-plan')" class="btn btn-accent">Next Step</button>
        </div>

        <div id="step-plan" class="step">
            <h2 class="text-3xl font-black mb-6">Choose Plan</h2>
            <div class="space-y-4 mb-8">
                <div class="p-4 border-2 border-sky-500 rounded-xl bg-sky-50 cursor-pointer">
                    <div class="font-black text-lg">Start Free</div>
                    <div class="text-sm text-slate-500">Basic tracking features to get started.</div>
                </div>
                <div onclick="window.location.href='pricing.html'" class="p-4 border border-slate-200 rounded-xl hover:border-sky-500 cursor-pointer transition">
                    <div class="font-black text-lg">View Pro Plans</div>
                    <div class="text-sm text-slate-500">Cloud Sync & Multi-unit support.</div>
                </div>
            </div>
            <div class="mt-6 pt-6 border-t border-slate-200">
                <label class="text-xs font-black uppercase tracking-widest text-slate-400 block mb-2">Have a Company Code?</label>
                <div class="flex gap-2">
                    <input type="text" id="companyCode" placeholder="Enter Code" class="mb-0" style="flex:1;">
                    <button class="btn btn-outline px-4" onclick="applyCompanyCode()">Apply</button>
                </div>
            </div>
            <button onclick="finalizeSetup()" class="btn btn-accent mt-8">Complete Setup & Enter App</button>
        </div>

    </div>

    <script>
        // INIT FIREBASE (Use your config)
        const firebaseConfig = { apiKey: "AIzaSyBgrI9HwJPSc5b4pu2Egsv4DE7shNwptSw", authDomain: "dts-hub-website.firebaseapp.com", projectId: "dts-hub-website" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth(); const db = firebase.firestore();

        let isRegisterMode = false; let currentUser = null;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                db.collection("users").doc(user.uid).get().then(doc => {
                    if (doc.exists && doc.data().name) window.location.href = 'ezmanage.html';
                    else nextStep('step-profile');
                });
            }
        });

        function toggleAuthMode(e) {
            e.preventDefault(); isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? "Create Account" : "Sign In";
            document.getElementById('authBtn').innerText = isRegisterMode ? "Sign Up" : "Sign In";
            document.getElementById('authToggleText').innerText = isRegisterMode ? "Already have an account?" : "Don't have an account?";
            document.getElementById('authToggleLink').innerText = isRegisterMode ? "Sign In" : "Create one";
        }

        function fillTestData() {
            document.getElementById('authEmail').value = "testmanager@ezmanage.local";
            document.getElementById('authPass').value = "Test1234!";
            isRegisterMode = true; toggleAuthMode(new Event('click'));
        }

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('authBtn'); btn.disabled = true;
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;
            try {
                if (isRegisterMode) await auth.createUserWithEmailAndPassword(email, pass);
                else await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) { alert(err.message); btn.disabled = false; }
        }

        async function signInWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider);
            } catch(err) { alert(err.message); }
        }

        function nextStep(stepId) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        function autoSelectTemplate() {
            const store = document.getElementById('setupStore').value;
            const msgBox = document.getElementById('templateMsg');
            if(store !== 'other' && store !== "") {
                document.getElementById('templateMsgText').innerText = `Template configured for ${document.getElementById('setupStore').options[document.getElementById('setupStore').selectedIndex].text} layout.`;
                msgBox.classList.remove('hidden');
            } else {
                msgBox.classList.add('hidden');
            }
        }

        function applyCompanyCode() {
            const code = document.getElementById('companyCode').value;
            if(code.trim().toUpperCase() === "DEMO_CORP") alert("Company Linked Successfully! Pro access granted via corporate.");
            else alert("Invalid code.");
        }

        async function finalizeSetup() {
            if(!currentUser) return;
            try {
                await db.collection('users').doc(currentUser.uid).set({
                    name: document.getElementById('setupName').value,
                    phone: document.getElementById('setupPhone').value,
                    role: document.getElementById('setupRole').value,
                    store: document.getElementById('setupStore').value,
                    email: currentUser.email,
                    plan: 'Free',
                    cloudSyncEnabled: false,
                    signupDate: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                
                await currentUser.updateProfile({ displayName: document.getElementById('setupName').value });
                window.location.href = 'ezmanage.html';
            } catch (e) {
                alert("Error saving profile: " + e.message);
            }
        }
        lucide.createIcons();
    </script>
</body>
</html>
